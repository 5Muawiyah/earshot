name: build

on:
  push:
    branches: ['**']   # every branch, so work is tested before it reaches main
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    permissions:
      contents: read      # the gate only reads the checkout
    timeout-minutes: 40   # a wedged build fails here rather than at the platform ceiling; the suite took 19 min on 2026-09-29
    env:
      # The install script runs in Windows PowerShell 5.1 and in PowerShell 7. A PC without pwsh skips the PowerShell 7
      # rows of its tests; this image has pwsh, and with this set a skipped row fails instead, so a hosted pass always
      # means both halves ran.
      EARSHOT_REQUIRE_PWSH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # tools\check.ps1 is the repository's own gate. It rebuilds every project from
      # scratch, runs the tests, and fails on a compiler or analyser warning, on a
      # suppressed diagnostic anywhere in the solution, and on an em-dash in the source.
      # It sets EARSHOT_SAFE_MODE itself, so no device action can run here, and it
      # prints its summary as JSON whether it passes or fails.
      #
      # It runs under pwsh here and under Windows PowerShell 5.1 on the owner's machine, on
      # purpose: the live-test self-test starts 5.1 children, and a child started below pwsh
      # is the case that once inherited a module path it could not use. Running the gate
      # under pwsh keeps that case executed on every push.
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools\check.ps1 -LogDir "${{ runner.temp }}\earshot-check"
      # The install script's own tests, once more on their own and by name, so the hosted run shows the PowerShell 7 half of
      # installer\earshot.ps1 running here, on an image that has pwsh, instead of leaving it counted among the gate's
      # passes. It uses the gate's own build. The gate's safe mode and temporary data root are set again, because those
      # tests refuse to go near a real install without them; EARSHOT_REQUIRE_PWSH (above) turns a skipped row into a failure.
      - name: Install script under PowerShell 7 and Windows PowerShell 5.1
        if: always()
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          $env:EARSHOT_SAFE_MODE = '1'
          $env:EARSHOT_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'earshot-installer-data'
          dotnet test tests\Earshot.Tests -c Debug --no-build -nologo -v:minimal --filter "FullyQualifiedName~InstallerScriptTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The summary keeps forty lines of a failure. The full build and test logs name every
      # skipped test and hold everything a failing one printed, so they are kept whether the
      # gate passed or not. They do not give a skip's reason: the gate runs at minimal
      # verbosity. Pinned to the commit behind v7.0.1.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: earshot-check-logs
          path: |
            ${{ runner.temp }}\earshot-check\build.log
            ${{ runner.temp }}\earshot-check\test.log
          if-no-files-found: warn
          retention-days: 14
      # A push whose commit message starts with "Release " also builds the release files from this same
      # checkout, once every step above has passed, and keeps them as a download for whoever publishes
      # the release. Pull requests and other commits skip both steps.
      - name: Release files
        if: success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools\build-release.ps1 -LogDir "${{ runner.temp }}\earshot-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
        with:
          name: earshot-release
          path: |
            artifacts/Earshot-*-win-x64.zip
            artifacts/Earshot-*-win-x64.zip.sha256
            artifacts/earshot.ps1
          if-no-files-found: error
          retention-days: 30
      # The same release build draws the widget's design pictures from synthetic snapshots (safe mode, a
      # temporary data root, the device called "AirPods"), so the designer sees exactly what ships. A
      # failure here is reported but does not fail the build.
      - name: Design pictures
        if: success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
        continue-on-error: true
        shell: pwsh
        run: |
          $env:EARSHOT_SAFE_MODE = '1'
          $env:EARSHOT_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'earshot-design-data'
          $out = Join-Path $env:RUNNER_TEMP 'earshot-design'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath 'publish\Earshot\Earshot.exe' -ArgumentList @('probe', 'widget', '--out', $out, '--set', 'design') -Wait -PassThru
          "exit $($p.ExitCode), pictures $(@(Get-ChildItem $out -Filter *.png).Count)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
        continue-on-error: true
        with:
          name: earshot-design
          path: ${{ runner.temp }}\earshot-design
          if-no-files-found: warn
          retention-days: 30
